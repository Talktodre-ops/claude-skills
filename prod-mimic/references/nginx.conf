# Stands in for an Application Load Balancer. It must never be the thing that
# fails: big limits, never marks a target down, never retries elsewhere.
worker_processes 2;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }
http {
  access_log off;
  upstream api {
    server api1:8000 max_fails=0;
    server api2:8000 max_fails=0;
    keepalive 128;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host www.example.com;          # production's host
      # The ALB appends the client address; k6 sends a simulated one.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
      proxy_next_upstream off;
    }
  }
}
